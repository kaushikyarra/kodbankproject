<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kodbank — Create Account</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet" />
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --blue: #4f8ef7;
      --purple: #7c5cfc;
      --cyan: #00d4ff;
      --gold: #ffd166;
      --dark: #0a0f1e;
      --card: rgba(255, 255, 255, 0.06);
      --border: rgba(255, 255, 255, 0.12);
      --text: #e8eaf6;
      --sub: #8892b0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--dark);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Animated gradient orbs */
    body::before,
    body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      filter: blur(120px);
      animation: floatOrb 8s ease-in-out infinite alternate;
      pointer-events: none;
    }

    body::before {
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(124, 92, 252, 0.35), transparent 70%);
      top: -100px;
      left: -100px;
    }

    body::after {
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(0, 212, 255, 0.25), transparent 70%);
      bottom: -80px;
      right: -80px;
      animation-delay: -4s;
    }

    @keyframes floatOrb {
      to {
        transform: translate(40px, 40px);
      }
    }

    .page-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 100vh;
      padding: 40px 16px;
      position: relative;
      z-index: 1;
    }

    /* Card */
    .card {
      background: var(--card);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 48px 44px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.5);
      animation: slideUp 0.6s cubic-bezier(0.22, 1, 0.36, 1);
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(40px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Brand */
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 32px;
    }

    .brand-icon {
      width: 42px;
      height: 42px;
      background: linear-gradient(135deg, var(--purple), var(--blue));
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      box-shadow: 0 4px 16px rgba(124, 92, 252, 0.5);
    }

    .brand-name {
      font-size: 22px;
      font-weight: 800;
      background: linear-gradient(90deg, var(--blue), var(--cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    h1 {
      font-size: 26px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 14px;
      color: var(--sub);
      margin-bottom: 36px;
    }

    /* Form */
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .form-group {
      position: relative;
    }

    .form-group.full {
      grid-column: 1 / -1;
    }

    .form-group input {
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      border: 1.5px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 18px 16px 8px;
      color: var(--text);
      font-size: 14px;
      font-family: 'Inter', sans-serif;
      outline: none;
      transition: border-color 0.3s, box-shadow 0.3s, background 0.3s;
    }

    .form-group input:focus {
      border-color: var(--purple);
      background: rgba(124, 92, 252, 0.08);
      box-shadow: 0 0 0 3px rgba(124, 92, 252, 0.2);
    }

    .form-group label {
      position: absolute;
      top: 50%;
      left: 16px;
      transform: translateY(-50%);
      color: var(--sub);
      font-size: 14px;
      pointer-events: none;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .form-group input:focus+label,
    .form-group input:not(:placeholder-shown)+label {
      top: 10px;
      transform: none;
      font-size: 11px;
      color: var(--purple);
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .form-group input::placeholder {
      color: transparent;
    }

    /* Role badge */
    .role-badge {
      background: rgba(0, 212, 255, 0.1);
      border: 1.5px solid rgba(0, 212, 255, 0.25);
      border-radius: 12px;
      padding: 12px 16px;
      color: var(--cyan);
      font-size: 14px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .role-badge span {
      font-size: 11px;
      opacity: 0.7;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    /* Submit */
    .btn-submit {
      width: 100%;
      margin-top: 28px;
      padding: 16px;
      background: linear-gradient(135deg, var(--purple), var(--blue));
      border: none;
      border-radius: 14px;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: transform 0.2s, box-shadow 0.3s;
      box-shadow: 0 8px 28px rgba(124, 92, 252, 0.5);
    }

    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 40px rgba(124, 92, 252, 0.7);
    }

    .btn-submit:active {
      transform: translateY(0);
    }

    .btn-submit::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      transition: width 0.5s, height 0.5s;
    }

    .btn-submit:active::after {
      width: 300px;
      height: 300px;
    }

    .btn-submit .btn-text {
      display: inline-block;
      transition: opacity 0.3s;
    }

    .btn-submit .spinner {
      display: none;
      width: 20px;
      height: 20px;
      border: 2px solid rgba(255, 255, 255, 0.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto;
    }

    .btn-submit.loading .btn-text {
      display: none;
    }

    .btn-submit.loading .spinner {
      display: block;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* Message */
    .message {
      margin-top: 16px;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 500;
      display: none;
      animation: fadeIn 0.3s ease;
    }

    .message.success {
      background: rgba(0, 214, 102, 0.12);
      border: 1px solid rgba(0, 214, 102, 0.3);
      color: #00d466;
    }

    .message.error {
      background: rgba(255, 72, 66, 0.12);
      border: 1px solid rgba(255, 72, 66, 0.3);
      color: #ff4242;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(-6px);
      }

      to {
        opacity: 1;
        transform: none;
      }
    }

    .login-link {
      text-align: center;
      margin-top: 24px;
      font-size: 14px;
      color: var(--sub);
    }

    .login-link a {
      color: var(--blue);
      text-decoration: none;
      font-weight: 600;
    }

    .login-link a:hover {
      text-decoration: underline;
    }

    /* Secure note */
    .secure-note {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 20px;
      font-size: 12px;
      color: var(--sub);
    }
  </style>
</head>

<body>
  <div class="page-wrap">
    <div class="card">
      <div class="brand">
        <div class="brand-icon">🏦</div>
        <div class="brand-name">Kodbank</div>
      </div>

      <h1>Create Account</h1>
      <p class="subtitle">Join Kodbank — secure banking for everyone</p>

      <form id="registerForm" novalidate>
        <div class="form-grid">
          <div class="form-group">
            <input type="text" id="uid" name="uid" placeholder="UID" required />
            <label for="uid">User ID</label>
          </div>
          <div class="form-group">
            <input type="text" id="username" name="username" placeholder="Username" required />
            <label for="username">Username</label>
          </div>
          <div class="form-group full">
            <input type="email" id="email" name="email" placeholder="Email" required />
            <label for="email">Email Address</label>
          </div>
          <div class="form-group full">
            <input type="password" id="password" name="password" placeholder="Password" required />
            <label for="password">Password</label>
          </div>
          <div class="form-group full">
            <input type="tel" id="phone" name="phone" placeholder="Phone" required />
            <label for="phone">Phone Number</label>
          </div>
        </div>

        <div class="role-badge" style="margin-top:20px;">
          🔒 &nbsp; Account Role: <strong>Customer</strong>
          <span style="margin-left:auto;">Auto-assigned</span>
        </div>

        <button type="submit" class="btn-submit" id="submitBtn">
          <span class="btn-text">Create Account →</span>
          <div class="spinner"></div>
        </button>

        <div class="message" id="msg"></div>
      </form>

      <p class="login-link">Already have an account? <a href="login.html">Sign In</a></p>
      <div class="secure-note">🔐 Bank-grade 256-bit encryption</div>
    </div>
  </div>

  <script>
    const API = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' ? 'http://localhost:5000' : '';

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const msg = document.getElementById('msg');

      const uid = document.getElementById('uid').value.trim();
      const username = document.getElementById('username').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const phone = document.getElementById('phone').value.trim();

      if (!uid || !username || !email || !password || !phone) {
        showMsg('Please fill in all fields.', 'error');
        return;
      }

      btn.classList.add('loading');
      btn.disabled = true;

      try {
        const res = await fetch(`${API}/api/auth/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ uid, username, email, password, phone })
        });
        const data = await res.json();

        if (res.ok && data.success) {
          showMsg('✅ Account created! Redirecting to login…', 'success');
          setTimeout(() => { window.location.href = 'login.html'; }, 1800);
        } else {
          showMsg(data.message || 'Registration failed.', 'error');
        }
      } catch (err) {
        showMsg('⚠️ Could not connect to server. Make sure backend is running.', 'error');
      } finally {
        btn.classList.remove('loading');
        btn.disabled = false;
      }
    });

    function showMsg(text, type) {
      const msg = document.getElementById('msg');
      msg.textContent = text;
      msg.className = 'message ' + type;
      msg.style.display = 'block';
    }
  </script>
</body>

</html>
